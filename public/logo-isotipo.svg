<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Lithium">
  <!--
    Isotipo de Lithium: el átomo. Rehecho a mano en vectorial porque el archivo
    de marca original es un render de presentación en raster, con el glow
    horneado y fondo gris sin transparencia (CLAUDE.md §9.0.2).

    Sin glow y sin gradientes a propósito: §9.7 los prohíbe en la interfaz, y un
    logo que los trae obliga al resto de la pantalla a competir con él.
  -->
  <g fill="none" stroke-width="2.4">
    <ellipse cx="32" cy="32" rx="27" ry="11" stroke="#1B4DA0" />
    <ellipse cx="32" cy="32" rx="27" ry="11" stroke="#1D63D2" transform="rotate(60 32 32)" />
    <ellipse cx="32" cy="32" rx="27" ry="11" stroke="#35C4D4" transform="rotate(120 32 32)" />
  </g>

  <!-- Electrones, uno por órbita, en el extremo del eje mayor de cada una -->
  <circle cx="59" cy="32" r="3.2" fill="#1B4DA0" />
  <circle cx="18.5" cy="8.6" r="3.2" fill="#1D63D2" />
  <circle cx="18.5" cy="55.4" r="3.2" fill="#35C4D4" />

  <!-- Núcleo -->
  <circle cx="32" cy="32" r="7.5" fill="#35C4D4" />
</svg>
